name: CI / CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run canary checks every 15 minutes
    - cron: '*/15 * * * *'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit & Integration Tests
        run: npm run test

      - name: Build
        run: npm run build

  canary_check:
    # Configure HEALTH_URL and HEALTH_PING_TOKEN as repository secrets to enable this check.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          HEALTH_PING_TOKEN: ${{ secrets.HEALTH_PING_TOKEN }}
        run: |
          if [ -z "$HEALTH_URL" ] || [ -z "$HEALTH_PING_TOKEN" ]; then
            echo "Canary skipped: configure HEALTH_URL and HEALTH_PING_TOKEN repository secrets."
            exit 0
          fi

          RESPONSE=$(curl --fail-with-body -sS "$HEALTH_URL/api/health" -H "Authorization: Bearer $HEALTH_PING_TOKEN")
          TWILIO=$(echo $RESPONSE | jq -r '.twilio')
          GEMINI=$(echo $RESPONSE | jq -r '.gemini')
          if [ "$TWILIO" != "ok" ] || [ "$GEMINI" != "ok" ]; then
            echo "Dependency is down! Response: $RESPONSE"
            exit 1
          fi
